<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json"><title>DEEP-Seek POS</title><style>*{box-sizing:border-box}body{margin:0;background:#090d16;color:#eef2f7;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0d1422ee;backdrop-filter:blur(14px);border-bottom:1px solid #263044;padding:14px;z-index:3}.wrap{max-width:1200px;margin:auto;padding:16px}.brand{font-size:20px;font-weight:800}.muted{color:#9aa7b8}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#101827;border:1px solid #263044;border-radius:16px;padding:16px;box-shadow:0 8px 30px #0003}.value{font-size:25px;font-weight:800;margin-top:6px}button,input{font:inherit}button{background:#d7b56d;color:#111;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}input{width:100%;background:#0b1220;color:#fff;border:1px solid #334056;border-radius:10px;padding:11px}.row{display:flex;gap:10px;align-items:center}.nav{display:flex;gap:8px;overflow:auto;margin-top:12px}.nav button{background:#182238;color:#dce5f2;white-space:nowrap}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #263044;text-align:left}.status{padding:5px 8px;border-radius:8px;background:#12301f;color:#77e2a3}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.row{flex-wrap:wrap}button{min-height:44px}}
</style></head><body><header><div class="wrap"><div class="brand">DEEP-Seek Enterprise POS</div><div class="muted">Offline-first • Multi-store • Accounting</div><div class="nav"><button onclick="load('/api/pnl','P&L')">P&L</button><button onclick="load('/api/trial-balance','Trial Balance')">Trial Balance</button><button onclick="load('/health','System Health')">Health</button></div></div></header><main class="wrap"><section class="grid" id="cards"><div class="card"><div class="muted">Connection</div><div class="value" id="conn">Checking…</div></div><div class="card"><div class="muted">Revenue</div><div class="value" id="rev">—</div></div><div class="card"><div class="muted">Expenses</div><div class="value" id="exp">—</div></div><div class="card"><div class="muted">Net Profit</div><div class="value" id="net">—</div></div></section><section class="card" style="margin-top:12px"><div class="row"><input id="api" placeholder="API URL e.g. http://localhost:8080" value=""><button onclick="save()">Connect</button></div><div class="muted" style="margin-top:8px">The desktop POS remains usable without this server. When connected, this client reads the same enterprise API.</div></section><section class="card" style="margin-top:12px"><h2 id="title">Dashboard</h2><div id="out" class="muted">Ready.</div></section></main><script>const key='deepseek_api';let base=localStorage.getItem(key)||location.origin;document.getElementById('api').value=base;function save(){base=document.getElementById('api').value.replace(/\/$/,'');localStorage.setItem(key,base);health();load('/api/pnl','P&L')}async function get(path){let r=await fetch(base+path);if(!r.ok)throw Error(await r.text());return r.json()}async function health(){try{let x=await get('/health');document.getElementById('conn').textContent=x.ok?'ONLINE':'CHECK';}catch(e){document.getElementById('conn').textContent='OFFLINE'}}async function load(path,title){document.getElementById('title').textContent=title;try{let x=await get(path);document.getElementById('out').innerHTML='<pre>'+JSON.stringify(x,null,2).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>';if(path.includes('pnl')){rev.textContent=x.revenue||'0';exp.textContent=x.expenses||'0';net.textContent=x.net_profit||'0'}}catch(e){document.getElementById('out').textContent='Offline / server unavailable — local POS can continue.'}}health();</script></body></html>
