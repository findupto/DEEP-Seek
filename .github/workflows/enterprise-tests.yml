name: Enterprise POS Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -r requirements-enterprise.txt
      - run: python -m pytest -q tests/test_enterprise_completion.py
      - run: python -m py_compile enterprise_completion_patch.py enterprise_services.py enterprise_backend.py
