services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deepseek
      POSTGRES_USER: deepseek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U deepseek -d deepseek"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redisdata:/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    environment:
      DATABASE_URL: postgresql+psycopg://deepseek:${POSTGRES_PASSWORD}@db:5432/deepseek
      REDIS_URL: redis://redis:6379/0
      POS_API_TOKEN: ${POS_API_TOKEN:?set in .env}
      POS_CORS: ${POS_CORS:-*}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
    expose: ["8080"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    command: ["python","worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://deepseek:${POSTGRES_PASSWORD}@db:5432/deepseek
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx.enterprise.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
